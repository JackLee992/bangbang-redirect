<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>打开帮帮</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf7f2;color:#392c29}
    body{margin:0;min-height:100vh;display:grid;place-items:center}
    main{padding:32px 24px;text-align:center;max-width:400px}
    h1{font-size:28px;font-weight:600;line-height:1.4;margin:0 0 16px}
    p{font-size:20px;line-height:1.6;color:#70615d;margin:0 0 28px}
    a{display:inline-block;font-size:22px;line-height:1.4;padding:16px 36px;border-radius:16px;background:#b64132;color:white;text-decoration:none;font-weight:600}
    a:focus-visible{outline:3px solid #392c29;outline-offset:5px}
  </style>
</head>
<body>
  <main>
    <h1>正在打开帮帮</h1>
    <p>如果没有自动打开，点下面的按钮。</p>
    <a id="open" href="https://bangbang-download.s419505080.chatgpt.site/">打开帮帮</a>
    <noscript><p>需要开启浏览器的 JavaScript，才能把连接口令一同带过去。</p></noscript>
  </main>
  <script>
    function redirectDestination(input) {
  const source = new URL(input);
  const destination = new URL("https://bangbang-download.s419505080.chatgpt.site/");
  let path = source.pathname;
  const projectPath = "/bangbang-redirect";
  if (source.hostname === "jacklee992.github.io") {
    if (path === projectPath) path = "/";
    else if (path.startsWith(projectPath + "/")) path = path.slice(projectPath.length);
  }
  const pages = { "/invite": "/invite.html", "/help": "/help.html", "/privacy": "/privacy.html" };
  path = pages[path.replace(/\/$/, "")] ?? path;
  destination.pathname = path || "/";
  destination.search = source.search;
  destination.hash = source.hash;
  return destination.href;
}
    const destination = redirectDestination(window.location.href);
    document.getElementById("open").href = destination;
    window.location.replace(destination);
  </script>
</body>
</html>
